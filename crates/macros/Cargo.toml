[package]
name = "macros"
version = "1.5.4"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
log = "0.4"
utoipa = { version = "5", features = ["actix_extras"] }
actix-web = "4.11.0"
koji-core = { path = "../koji-core" }
koji-db = { path = "../koji-db" }
sea-orm = { version = "1", default-features = false }
