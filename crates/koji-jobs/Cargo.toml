[package]
name    = "koji-jobs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "koji_jobs"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
dashmap = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
sea-orm = { workspace = true, features = [
  "sqlx-mysql",
  "runtime-tokio-native-tls",
  "macros",
  "with-json",
  "with-chrono",
] }

[dev-dependencies]
serde_json = { workspace = true }
# DB-integration tests (tests/queue_db.rs) need a multi-thread runtime for the
# `await_result` poll loop, plus a direct sea-orm handle for the raw terminal
# UPDATE + cleanup DELETEs (sea-orm itself is a normal dep, reused here).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
