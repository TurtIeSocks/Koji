[package]
name = "koji-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
algorithms = { workspace = true }
koji-core = { workspace = true }
geojson = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
# tsify 0.5.6 is latest; 0.4 from spec no longer exists — pinned up to match
# wasm-bindgen 0.2.101 already in Cargo.lock
tsify = { workspace = true }
console_error_panic_hook = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { workspace = true }
getrandom = { workspace = true }
getrandom03 = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

# wasm-pack's bundled wasm-opt can strip shared memory / atomics from a threaded
# build (breaking wasm-bindgen-rayon workers with a DataCloneError). Disable it;
# size optimization can be re-added later with an explicitly threads-aware wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
