[package]
name    = "algorithms"
version = "1.3.0"
edition = "2024"
publish = false

[lib]
name = "algorithms"
path = "src/lib.rs"

[dependencies]
koji-core    = { workspace = true }
koji-plugins = { workspace = true, optional = true }
chrono       = { workspace = true }
colored      = { workspace = true, optional = true }
geo          = { workspace = true }
geohash      = { workspace = true }
geojson      = { workspace = true }
hashbrown    = { workspace = true }
log          = { workspace = true }
map_3d       = { workspace = true }
rand         = { workspace = true }
rayon        = { workspace = true }
rstar        = { workspace = true }
s2           = { workspace = true }
web-time     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sysinfo      = { workspace = true, optional = true }
tsp-geo      = { workspace = true }

macros = { workspace = true }

[features]
default = ["native"]
# Native-only: filesystem debug dumps, system memory probing, plugin execution.
native = ["dep:sysinfo", "dep:koji-plugins", "dep:colored", "tsp-geo/parallel"]

# Restore s2's `float_extras` (libc-based, wasm-incompatible) on native targets
# only, so native behavior is unchanged while wasm32 builds exclude it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
s2 = { workspace = true, features = ["float_extras"] }

# `rand`'s `sys_rng` feature (always on — see the `rand` dep above) pulls in
# getrandom 0.4, which refuses to pick a wasm32-unknown-unknown backend unless
# something in the graph turns on its `wasm_js` feature (see the workspace-level
# `getrandom` entry's comment). `koji-wasm` already carries this via its own
# target dep, but `algorithms` needs it too so it compiles standalone for wasm
# (e.g. `cargo check -p algorithms --no-default-features --target
# wasm32-unknown-unknown`), not only when pulled in through koji-wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
