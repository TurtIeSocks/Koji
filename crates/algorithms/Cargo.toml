[package]
name = "algorithms"
version = "1.3.0"
edition = "2024"
publish = false

[lib]
name = "algorithms"
path = "src/lib.rs"

[dependencies]
koji-core = { workspace = true }
koji-plugins = { workspace = true, optional = true }
chrono = { workspace = true }
colored = { workspace = true, optional = true }
geo = { workspace = true }
geohash = { workspace = true }
geojson = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true }
map_3d = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
rstar = { workspace = true }
s2 = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true, optional = true }

macros = { workspace = true }

[features]
default = ["native"]
# Native-only: filesystem debug dumps, system memory probing, plugin execution.
native = ["dep:sysinfo", "dep:koji-plugins", "dep:colored"]

# Restore s2's `float_extras` (libc-based, wasm-incompatible) on native targets
# only, so native behavior is unchanged while wasm32 builds exclude it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
s2 = { workspace = true, features = ["float_extras"] }
