[package]
name = "koji-dragonite"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "koji_dragonite"
path = "src/lib.rs"

[dependencies]
koji-core = { path = "../koji-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geojson = "0.24.2"
thiserror = "2"
log = "0.4"

[dev-dependencies]
serde_json = "1"
