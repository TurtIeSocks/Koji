[package]
name = "koji-db"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "koji_db"
path = "src/lib.rs"

[dependencies]
koji-core = { workspace = true }
macros = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
geo = { workspace = true }
geojson = { workspace = true }
geo-types = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
sea-orm = { workspace = true, features = [
  "sqlx-mysql",
  "runtime-actix-native-tls",
  "macros",
] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# DB-integration tests (tests/crud_db.rs) — a tokio runtime for `#[tokio::test]`
# plus a direct `serde_json`/`sea-orm` handle for cleanup DELETEs. sea-orm is a
# normal dep above (reused for the connection + raw statements).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
