[package]
name = "koji-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "koji_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
log = { workspace = true }
geojson = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }
rayon = "1.11.0"
s2 = { version = "0.0.13", default-features = false, features = ["serde"] }

# Restore s2's `float_extras` (libc-based, wasm-incompatible) on native targets
# only, so native behavior is unchanged while wasm32 builds exclude it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
s2 = { version = "0.0.13", default-features = false, features = ["serde", "float_extras"] }

[dev-dependencies]
serde_json = { workspace = true }
