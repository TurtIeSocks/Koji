      tags: [geo]
      summary: Convert / normalize geometry.
      description: |
        Normalize the supplied `area` to the requested return type (optionally
        simplifying). Geometry-bearing — honors `?rt=`. Ports v1 `/convert/data`.
      parameters:
        - $ref: "#/components/parameters/RtQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoArgs"
      responses:
