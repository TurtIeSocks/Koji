components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `KOJI_SECRET` as a bearer token.

  parameters:
    JobIdPath:
      name: id
      in: path
      required: true
      description: The job id.
      schema:
        type: string
    ModePath:
      name: mode
      in: path
      required: true
      description: The calc mode (e.g. a clustering / routing / `bootstrap` algorithm).
      schema:
        type: string
    CategoryPath:
      name: category
      in: path
      required: true
      description: The data category (e.g. `pokestop`, `gym`, `spawnpoint`).
      schema:
        type: string
    IdOrNamePath:
      name: id
      in: path
      required: true
      description: The numeric id (writes) or id/name (reads).
      schema:
        type: string
    WaitQuery:
      name: wait
      in: query
      required: false
      description: When truthy (`1`), block up to ~290s for the result (sync bridge); else async.
      schema:
        type: integer
        format: int32
        enum: [0, 1]
        default: 0
    RtQuery:
      name: rt
      in: query
      required: false
      description: |
        Return type. Defaults to `featurecollection` (lists) / `feature` (single).
        Non-GeoJSON values change the raw response shape.
      schema:
        type: string
        enum:
          - alttext
          - text
          - array
          - multiarray
          - struct
          - multistruct
          - geometry
          - geometryvector
          - feature
          - featurevector
          - featurecollection
          - poraclesingle
          - poracle
          - sql
    InternalQuery:
      name: internal
      in: query
      required: false
      description: When true, internal DB properties (with a `__` prefix, plus a generated `id`) are added. Development use only.
      schema:
        type: boolean

  requestBodies:
    JsonBody:
      required: true
      description: The record fields as a JSON object.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    BadRequest:
      description: Malformed request (JSend `fail`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendFail"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendError"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendError"
    Conflict:
      description: Conflict (e.g. the job was canceled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendError"
    Unprocessable:
      description: Semantically invalid (e.g. unlinked geofence, validation error).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/JSendFail"
              - $ref: "#/components/schemas/JSendError"
    ServerError:
      description: Internal server error (JSend `error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendError"
    GatewayTimeout:
      description: |
        The sync bridge timed out; the job is still running. `data.job_id` lets
        the caller poll `GET /api/v2/jobs/{id}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSendError"

  schemas:
    JSendSuccess:
      type: object
      description: JSend success envelope. `data` shape is per-endpoint.
      required: [status, data]
      properties:
        status:
          type: string
          const: success
        data:
          description: The endpoint payload (object, array, or scalar).
      additionalProperties: false
    JSendFail:
      type: object
      description: JSend fail envelope (client-side rejection / validation).
      required: [status, data]
      properties:
        status:
          type: string
          const: fail
        data:
          type: object
          description: Machine-readable description of what was wrong (field → message).
          additionalProperties: true
      additionalProperties: false
    JSendError:
      type: object
      description: JSend error envelope (server-side processing failure).
      required: [status, message]
      properties:
        status:
          type: string
          const: error
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable code (e.g. `not_found`, `validation_error`, `timeout`).
        data:
          description: Optional extra context (e.g. `{ job_id }`).
      additionalProperties: false
    JSendJobId:
      type: object
      description: A success envelope whose `data` carries an enqueued job id.
      required: [status, data]
      properties:
        status:
          type: string
          const: success
        data:
          type: object
          required: [job_id]
          properties:
            job_id:
              type: string
              description: The enqueued job id.
      additionalProperties: false
    JSendRowsAffected:
      type: object
      description: A success envelope whose `data` carries the number of rows affected.
      required: [status, data]
      properties:
        status:
          type: string
          const: success
        data:
          type: object
          required: [rows_affected]
          properties:
            rows_affected:
              type: integer
              format: int64
      additionalProperties: false
    Feature:
      type: object
      description: A GeoJSON Feature (loosely modeled; see RFC 7946).
      required: [type, geometry]
      properties:
        type:
          type: string
          const: Feature
        geometry:
          type: object
          additionalProperties: true
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
        id:
          oneOf:
            - type: string
            - type: number
      additionalProperties: true
    FeatureCollection:
      type: object
      description: A GeoJSON FeatureCollection (loosely modeled; see RFC 7946).
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
      additionalProperties: true
    EnqueueBody:
      type: object
      description: Body for `POST /api/v2/jobs`.
      required: [kind]
      properties:
        kind:
          type: string
          description: The handler kind (e.g. `calculate`).
        payload:
          description: The job payload, passed opaquely to the handler.
          default: {}
      additionalProperties: false
