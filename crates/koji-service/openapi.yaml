        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/geo/merge-points:
    post:
      operationId: geoMergePoints
      tags: [geo]
      summary: Merge point features into one MultiPoint.
      description: Collapse the point features of `area` into a single MultiPoint. Ports v1 `/convert/merge-points`.
      parameters:
        - $ref: "#/components/parameters/RtQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoArgs"
      responses:
        "200":
          description: The merged MultiPoint geometry.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/geo/s2/circle-coverage:
    post:
      operationId: geoS2CircleCoverage
      tags: [geo]
      summary: S2 cells covering a circle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageArgs"
      responses:
        "200":
          description: The covering S2 cells.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/geo/s2/cell-coverage:
    post:
      operationId: geoS2CellCoverage
      tags: [geo]
      summary: S2 cell ids covering a cell area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageArgs"
      responses:
        "200":
          description: The covering S2 cell ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/geo/s2/polygons:
    post:
      operationId: geoS2Polygons
      tags: [geo]
      summary: Polygons for the given S2 cell ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: S2 cell ids.
      responses:
        "200":
          description: The cell polygons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/geo/s2/{cell_level}:
    post:
      operationId: geoS2Cells
      tags: [geo]
      summary: S2 cells within a bbox at a given level.
      parameters:
        - name: cell_level
          in: path
          required: true
          description: The S2 cell level.
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoundsArg"
      responses:
        "200":
          description: The S2 cells in the bbox (optionally filtered to `ids`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/scanner-data/{category}:
    get:
      operationId: getScannerData
      tags: [scanner-data]
      summary: Scanner points within a geofence.
      description: |
        Fetch the `{category}` scanner points (gym / pokestop / spawnpoint /
        station) inside the `?instance=` geofence. Reuses the same query path as
        v1 `/internal/data/area`. A GET can't carry the v1 `Args` body, so the
        area is keyed by geofence name.
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - name: instance
          in: query
          required: true
          description: The geofence name whose area bounds the fetch.
          schema:
            type: string
        - name: last_seen
          in: query
          required: false
          description: Only points updated within the last N seconds (`0` = no filter).
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        "200":
          description: The category's scanner points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `KOJI_SECRET` as a bearer token.

  parameters:
    JobIdPath:
      name: id
      in: path
      required: true
      description: The job id.
      schema:
        type: string
    ModePath:
      name: mode
      in: path
      required: true
      description: The calc mode (e.g. a clustering / routing / `bootstrap` algorithm).
      schema:
        type: string
    CategoryPath:
      name: category
      in: path
      required: true
      description: The data category (e.g. `pokestop`, `gym`, `spawnpoint`).
      schema:
        type: string
    IdOrNamePath:
      name: id
      in: path
      required: true
      description: The numeric id (writes) or id/name (reads).
      schema:
        type: string
    WaitQuery:
      name: wait
      in: query
      required: false
      description: When truthy (`1`), block up to ~290s for the result (sync bridge); else async.
      schema:
        type: integer
        format: int32
        enum: [0, 1]
        default: 0
    RtQuery:
      name: rt
      in: query
      required: false
      description: |
        Return type. Defaults to `featurecollection` (lists) / `feature` (single).
        Non-GeoJSON values change the raw response shape.
      schema:
        type: string
        enum:
          - alttext
          - text
          - array
          - multiarray
          - struct
          - multistruct
          - geometry
          - geometryvector
          - feature
          - featurevector
          - featurecollection
          - poraclesingle
          - poracle
          - sql
    InternalQuery:
      name: internal
      in: query
      required: false
      description: When true, internal DB properties (with a `__` prefix, plus a generated `id`) are added. Development use only.
      schema:
        type: boolean

  requestBodies:
    JsonBody:
      required: true
      description: The record fields as a JSON object.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  responses:
    BadRequest:
      description: Malformed request — `error` envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflict (e.g. the job was canceled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: Semantically invalid (e.g. unlinked geofence, validation error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Internal server error — `error` envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    GatewayTimeout:
      description: |
        The sync bridge timed out; the job is still running. `data.job_id` lets
        the caller poll `GET /api/v2/jobs/{id}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiOk:
      type: object
      description: |
        Success envelope (architecture §7) — `status: ok` plus the per-endpoint
        `data`. Matches Dragonite v2 (which dropped JSend for this shape).
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        data:
          description: The endpoint payload (object, array, or scalar).
        meta:
          $ref: "#/components/schemas/ApiMeta"
      additionalProperties: false
    ApiError:
      type: object
      description: |
        Error envelope (architecture §7) — `status: error` plus an `error`
        object carrying a stable `code`, a human `message`, and an optional
        `field` for per-field validation errors. Covers both client rejections
        (4xx) and server failures (5xx).
      required: [status, error]
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code (e.g. `not_found`, `unprocessable`, `invalid_request`, `timeout`).
            message:
              type: string
              description: Human-readable error message.
            field:
              type: string
              description: The offending request field, for per-field validation errors.
          additionalProperties: false
      additionalProperties: false
    ApiMeta:
      type: object
      description: |
        Pagination block for `ok` collection responses (architecture §7).
        Reserved: Koji's list endpoints currently return their full result set,
        so this is omitted until list pagination lands.
      required: [total, page, per_page, total_pages, has_next, has_prev]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer, format: int64 }
        per_page: { type: integer, format: int64 }
        total_pages: { type: integer, format: int64 }
        has_next: { type: boolean }
        has_prev: { type: boolean }
      additionalProperties: false
    ApiJobId:
      type: object
      description: A success envelope whose `data` carries an enqueued job id.
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        data:
          type: object
          required: [job_id]
          properties:
            job_id:
              type: string
              description: The enqueued job id.
      additionalProperties: false
    ApiRowsAffected:
      type: object
      description: A success envelope whose `data` carries the number of rows affected.
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        data:
          type: object
          required: [rows_affected]
          properties:
            rows_affected:
              type: integer
              format: int64
      additionalProperties: false
    Feature:
      type: object
      description: A GeoJSON Feature (loosely modeled; see RFC 7946).
      required: [type, geometry]
      properties:
        type:
          type: string
          const: Feature
        geometry:
          type: object
          additionalProperties: true
          nullable: true
        properties:
          type: object
          additionalProperties: true
          nullable: true
        id:
          oneOf:
            - type: string
            - type: number
      additionalProperties: true
    FeatureCollection:
      type: object
      description: A GeoJSON FeatureCollection (loosely modeled; see RFC 7946).
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
      additionalProperties: true
    EnqueueBody:
      type: object
      description: Body for `POST /api/v2/jobs`.
      required: [kind]
      properties:
        kind:
          type: string
          description: The handler kind (e.g. `calculate`).
        payload:
          description: The job payload, passed opaquely to the handler.
          default: {}
      additionalProperties: false
    GeoArgs:
      type: object
      description: |
        The Koji `Args` body for the `/geo/*` transforms — carries the `area`
        (geofence / GeoJSON / point list) plus optional knobs (`return_type`,
        `simplify`, `instance`, `benchmark_mode`, …). Loosely modeled; the full
        `Args` shape is the same one the v1 `/convert/*` endpoints accept.
      properties:
        area:
          description: The geometry to transform (geofence name, GeoJSON, or point list).
        return_type:
          type: string
          description: Optional return type (overridden by `?rt=`).
        simplify:
          type: boolean
          description: When true, simplify before converting.
      additionalProperties: true
    CoverageArgs:
      type: object
      description: Center + level for the S2 coverage helpers.
      required: [lat, lon, level]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        radius:
          type: number
          format: double
          description: Circle radius in metres (circle-coverage; default 70).
        size:
          type: integer
          format: int32
          description: Cell grid size (cell-coverage; default 15).
        level:
          type: integer
          format: int32
          description: The S2 cell level.
      additionalProperties: false
    BoundsArg:
      type: object
      description: A bounding box, optionally filtered to a set of cell ids.
      required: [min_lat, min_lon, max_lat, max_lon]
      properties:
        min_lat: { type: number, format: double }
        min_lon: { type: number, format: double }
        max_lat: { type: number, format: double }
        max_lon: { type: number, format: double }
        ids:
          type: array
          items:
            type: string
          description: When present, only cells whose id is in this set are returned.
      additionalProperties: true
