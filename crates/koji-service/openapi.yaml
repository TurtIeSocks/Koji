      operationId: listProjects
      tags: [projects]
      summary: List projects.
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project.
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          description: Created project record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdOrNamePath"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one project (by id or name).
      responses:
        "200":
          description: One project record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project by id.
      requestBody:
