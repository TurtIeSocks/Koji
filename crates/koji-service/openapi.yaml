openapi: 3.1.0
info:
  title: Koji v2 API
  version: 1.5.1
  summary: Clean v2 surface for Koji over the job queue.
  description: |
    The `/api/v2` surface of Koji: a job-queue-backed calc API plus typed CRUD
    for geofences, routes, projects, properties, and tile-servers.

    All responses use the [JSend](https://github.com/omniti-labs/jsend) envelope
    (`success` / `fail` / `error`) — see the `JSend*` schemas.

    Authentication: every `/api/v2/*` endpoint requires
    `Authorization: Bearer <KOJI_SECRET>` (a session cookie from the Koji admin
    panel also satisfies auth). The liveness probes (`/healthz`, `/health`) and
    this document (`/api/v2/openapi.yaml`) are unauthenticated.

    Geometry-bearing reads (geofences, routes) accept a `rt` (return-type) query
    param that switches the response shape away from GeoJSON (text, array,
    poracle, sql, …); when omitted the response is a GeoJSON `Feature` /
    `FeatureCollection`. Those alternate shapes are returned raw (not JSend
    wrapped) to preserve drop-in compatibility with v1 consumers.

servers:
  - url: /
    description: Same-origin (the Koji service serves this spec and the API).

tags:
  - name: health
    description: Liveness probes (unauthenticated).
  - name: jobs
    description: Generic async job API.
  - name: calc
    description: Calculation sugar over the job queue (sync-bridged with `?wait`).
  - name: meta
    description: Algorithm / capability metadata.
  - name: geofences
    description: Typed CRUD for geofences (geometry-bearing) + Dragonite publish.
  - name: routes
    description: Typed CRUD for routes (geometry-bearing).
  - name: projects
    description: Typed CRUD for projects.
  - name: properties
    description: Typed CRUD for properties.
  - name: tile-servers
    description: Typed CRUD for tile-servers.

# Applied globally; the unauthenticated operations override with `security: []`.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe.
      description: Returns 200 with an empty body. Unauthenticated.
      security: []
      responses:
        "200":
          description: Service is up.

  /health:
    get:
      operationId: health
      tags: [health]
      summary: Liveness probe (alias).
      description: Alias of `/healthz`. Returns 200 with an empty body. Unauthenticated.
      security: []
      responses:
        "200":
          description: Service is up.

  /api/v2/openapi.yaml:
    get:
      operationId: getOpenapiSpec
      tags: [meta]
      summary: This OpenAPI document.
      description: Serves this spec as YAML. Unauthenticated so doc tooling can fetch it.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            text/yaml:
              schema:
                type: string

  /api/v2/jobs:
    post:
      operationId: enqueueJob
      tags: [jobs]
      summary: Enqueue a job.
      description: |
        Enqueue a job of the given `kind` with an opaque `payload`. Returns
        `202` with the assigned `job_id`; poll `GET /api/v2/jobs/{id}` for status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueBody"
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendJobId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobIdPath"
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job's status / progress / result.
      responses:
        "200":
          description: The job record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: cancelJob
      tags: [jobs]
      summary: Request cancellation of a job.
      description: |
        A queued job is canceled immediately; a running job is canceled at its
        next phase boundary.
      responses:
        "200":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/calc/{mode}:
    parameters:
      - $ref: "#/components/parameters/ModePath"
      - $ref: "#/components/parameters/WaitQuery"
    post:
      operationId: calcMode
      tags: [calc]
      summary: Run a calculation (default `pokestop` category).
      description: |
        Resolves the area + data points, enqueues a high-priority `calculate`
        job, then either returns `202 { job_id }` (async) or, with `?wait=1`,
        blocks up to ~290s for the result via the sync bridge. On timeout the
        bridge returns `504` with the `job_id` so the caller can poll.
      requestBody:
        required: true
        description: A Koji calc `Args` object (area / instance / data_points / knobs).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Calculation result (sync, `?wait=1`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "202":
          description: Job accepted (async).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendJobId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v2/calc/{mode}/{category}:
    parameters:
      - $ref: "#/components/parameters/ModePath"
      - $ref: "#/components/parameters/CategoryPath"
      - $ref: "#/components/parameters/WaitQuery"
    post:
      operationId: calcModeCategory
      tags: [calc]
      summary: Run a calculation for an explicit data category.
      description: Same as `POST /api/v2/calc/{mode}` but with an explicit data category.
      requestBody:
        required: true
        description: A Koji calc `Args` object (area / instance / data_points / knobs).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Calculation result (sync, `?wait=1`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "202":
          description: Job accepted (async).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendJobId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v2/meta/algorithms:
    get:
      operationId: metaAlgorithms
      tags: [meta]
      summary: Available clustering / routing / bootstrap algorithms.
      description: The available algorithm options (plugins included), grouped by stage.
      responses:
        "200":
          description: Algorithm options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/geofences:
    get:
      operationId: listGeofences
      tags: [geofences]
      summary: List geofences.
      description: |
        Defaults to a GeoJSON `FeatureCollection`. With `?rt=` set to a non-GeoJSON
        return type (text / array / poracle / sql / …) the body is that raw shape
        instead of the JSend/GeoJSON form.
      parameters:
        - $ref: "#/components/parameters/RtQuery"
        - $ref: "#/components/parameters/InternalQuery"
      responses:
        "200":
          description: Geofences (FeatureCollection by default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createGeofence
      tags: [geofences]
      summary: Create a geofence.
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "201":
          description: Created geofence record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/geofences/{id}:
    parameters:
      - $ref: "#/components/parameters/IdOrNamePath"
    get:
      operationId: getGeofence
      tags: [geofences]
      summary: Get one geofence (by id or name).
      description: Defaults to a GeoJSON `Feature`; honors `?rt=` like the list endpoint.
      parameters:
        - $ref: "#/components/parameters/RtQuery"
        - $ref: "#/components/parameters/InternalQuery"
      responses:
        "200":
          description: One geofence (Feature by default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateGeofence
      tags: [geofences]
      summary: Update a geofence by id.
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          description: Updated geofence record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteGeofence
      tags: [geofences]
      summary: Delete a geofence by id.
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendRowsAffected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/geofences/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/IdOrNamePath"
    post:
      operationId: publishGeofence
      tags: [geofences]
      summary: Publish a geofence's fence to its linked Dragonite area.
      description: |
        Appends an `area.geofence_updated` event to the outbox; the dispatcher
        delivers it to Dragonite (`PATCH /v2/areas/{id}`). Returns `202` with the
        outbox `event_id`. A geofence with no linked `dragonite_area_id` yields
        `422`; an unknown geofence yields `404`.
      responses:
        "202":
          description: Publish event enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSendSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v2/routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List routes.
      description: Defaults to a GeoJSON `FeatureCollection`; honors `?rt=` and `?internal=`.
      parameters:
        - $ref: "#/components/parameters/RtQuery"
        - $ref: "#/components/parameters/InternalQuery"
