    get:
      operationId: getProperty
      tags: [properties]
      summary: Get one property (by id or name).
      responses:
        "200":
          description: One property record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property by id.
      requestBody:
        $ref: "#/components/requestBodies/JsonBody"
      responses:
        "200":
          description: Updated property record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property by id.
      responses:
        "200":
