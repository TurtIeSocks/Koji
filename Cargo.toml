[workspace]
resolver = "3"
members  = ["crates/*", "apps/koji-cli", "apps/koji-server"]

# Single source of truth for every dependency version used across the workspace.
# Each crate references these with `dep = { workspace = true }` and layers on its
# own `features` / `optional` / `default-features` as needed (Cargo unions the
# feature sets). Versions live here only — bump in one place.
[workspace.dependencies]

# ── Internal crates (path) ────────────────────────────────────────────────
# default-features off so koji-wasm can exclude the `native` feature; native
# consumers (koji-service) re-add `features = ["native"]`.
algorithms     = { path = "crates/algorithms", default-features = false }
koji-core      = { path = "crates/koji-core" }
koji-db        = { path = "crates/koji-db" }
koji-dragonite = { path = "crates/koji-dragonite" }
koji-events    = { path = "crates/koji-events" }
koji-golbat    = { path = "crates/koji-golbat" }
koji-jobs      = { path = "crates/koji-jobs" }
koji-plugins   = { path = "crates/koji-plugins" }
koji-service   = { path = "crates/koji-service" }
macros         = { path = "crates/macros" }
migration      = { path = "crates/migration" }
nominatim      = { path = "crates/nominatim" }

# ── External: shared by several crates ────────────────────────────────────
# Features that every consumer shares are declared here; per-crate extras are
# added at the use site.
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.150"
serde_with  = "3.21.0"
log         = "0.4.32"
thiserror   = "2.0.18"
chrono      = "0.4.45"                                       # consumers add features = ["serde"] as needed
reqwest     = "0.13.4"                                       # consumers add features = ["json"] as needed
regex       = "1.12.4"
async-trait = "0.1.89"
sha2        = "0.11.0"
ulid        = "1.2.1"
url         = "2.5.8"
rayon       = "1.12.0"
geo         = "0.33.1"
geo-types   = "0.7.19"
geojson     = "1.0.0"
# default-features off (libc-based `float_extras` is wasm-incompatible); native
# targets re-add it at the use site.
s2 = { version = "0.0.13", default-features = false, features = ["serde"] }
# Sequential core by default so koji-wasm stays rayon-free here; the
# algorithms crate's `native` feature re-adds `tsp-geo/parallel`.
tsp-geo = { version = "0.3", default-features = false, features = ["std"] }
# Runtimes/extra features differ per crate (actix vs tokio runtime, with-json,
# with-chrono); declared at each use site. Only the version is pinned here.
sea-orm    = "1.1.20"
utoipa     = { version = "5.5.0", features = ["actix_extras"] }
actix-web  = "4.13.0"
actix-ws   = "0.3.0"
tokio      = "1.52.3"                                           # consumers select their own runtime features
dotenv     = "0.15.0"
env_logger = "0.11.10"

# ── External: single-consumer (centralized for one-place version bumps) ───
# CLI
clap = { version = "4.6.1", features = ["derive"] }
# server
tikv-jemallocator = "0.7.0"
# algorithms
colored = "3.1.1"
geohash = "0.13.2"
hashbrown = "0.17.1"
map_3d = "0.1.7"
rand = { version = "0.10.1", default-features = false, features = [
  "std",
  "std_rng",
  "thread_rng",
  "sys_rng",
] }
rstar = "0.13.0"
web-time = "1.1.0"
sysinfo = "0.39.3"
# koji-db
futures = "0.3.32"
# koji-jobs
dashmap = "6.2.1"
# koji-events
hmac = "0.13.0"
hex  = "0.4.3"
# koji-plugins
toml     = "1.1.2"
tempfile = "3.27.0"
# koji-service
actix-files        = "0.6.10"
actix-session      = { version = "0.11.0", features = ["cookie-session"] }
actix-web-httpauth = "0.8.2"
actix-test         = "0.1.5"
awc                = { version = "3.7.0", features = ["rustls"] }
futures-util       = "0.3.32"
subtle             = "2.6.1"
# migration
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
sea-orm-migration = { version = "1.1.20", features = [
  "runtime-actix-native-tls",
  "sqlx-mysql",
  "with-json",
] }
# nominatim
serde_urlencoded = "0.7.1"
derive_builder   = "0.20.2"
# koji-wasm
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.125"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen-rayon = "1.3.0"
# Web backend for any transitive getrandom user on wasm. 0.2's "js" feature
# became "wasm_js" in 0.3+; both old majors collapsed into one at 0.4.
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen-test = "0.3.75"
# macros (proc-macro toolchain)
syn         = { version = "2.0.118", features = ["full"] }
quote       = "1.0.45"
proc-macro2 = "1.0.106"
